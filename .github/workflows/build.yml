name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact-name: DocumentSanitizer-Windows
            executable: dist/DocumentSanitizer.exe
          - os: macos-latest
            artifact-name: DocumentSanitizer-macOS
            executable: dist/DocumentSanitizer.app
          - os: ubuntu-22.04
            artifact-name: DocumentSanitizer-Linux
            executable: dist/DocumentSanitizer

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # Linux: install Qt system dependencies
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-xinerama0 \
            libxkbcommon-x11-0 \
            libglib2.0-0 \
            libegl1 \
            libgl1-mesa-glx

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Build with PyInstaller
        run: pyinstaller document_sanitizer.spec

      # ── macOS: create DMG ──────────────────────────
      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Document Sanitizer" \
            --volicon "icons/app.icns" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon "DocumentSanitizer.app" 150 200 \
            --app-drop-link 450 200 \
            "dist/DocumentSanitizer-macOS.dmg" \
            "dist/DocumentSanitizer.app"

      # ── Windows: build Inno Setup installer ────────
      - name: Build Windows Installer
        if: runner.os == 'Windows'
        run: iscc installer.iss

      # ── Linux: set executable permission ───────────
      - name: Set executable permission (Linux)
        if: runner.os == 'Linux'
        run: chmod +x dist/DocumentSanitizer

      # ── Upload artifacts ───────────────────────────
      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            dist/DocumentSanitizer.exe
            dist/Output/DocumentSanitizer_Setup.exe

      - name: Upload build artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/DocumentSanitizer-macOS.dmg

      - name: Upload build artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/DocumentSanitizer

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DocumentSanitizer-Windows/**
            artifacts/DocumentSanitizer-macOS/**
            artifacts/DocumentSanitizer-Linux/**
          draft: true
          generate_release_notes: true
